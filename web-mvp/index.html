<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lernzeit 🌟</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- ONBOARDING -->
  <section id="s-onboard" class="screen active">
    <h1>🌟 Lernzeit</h1>
    <p class="subtitle">Kurz einrichten</p>
    <div style="max-width:460px;margin:0 auto;width:100%;text-align:center">
      <label>Wie heißt das Kind?</label>
      <input id="childName" class="field" placeholder="z.B. Mia" />
      <label>Was möchtest du besonders fördern?</label>
      <div id="focusChips" class="toggle">
        <div class="chip on" data-f="memory">🧠 Gedächtnis</div>
        <div class="chip on" data-f="speech">🗣️ Sprache</div>
        <div class="chip" data-f="reading">🔤 Lesen</div>
        <div class="chip" data-f="math">🔢 Rechnen</div>
      </div>
      <p class="muted">Ton & Mikrofon nötig. Audio wird nur lokal im Browser verarbeitet — nichts gespeichert oder gesendet.</p>
      <button class="btn green big" style="width:100%;margin-top:10px" onclick="UI.finishOnboard()">Los geht's! ▶</button>
    </div>
  </section>

  <!-- HOME -->
  <section id="s-home" class="screen">
    <div class="topbar">
      <button class="btn gray" style="padding:9px 14px;font-size:15px" onclick="UI.openParent()">👨‍👩‍👧 Eltern</button>
      <div class="stars" id="homeStars"></div>
    </div>
    <h1 id="homeHi">Hallo!</h1>
    <p class="subtitle">Was möchtest du spielen?</p>
    <div id="homeMsg" class="subtitle" style="color:var(--pink);font-weight:800;min-height:24px;margin-top:-6px"></div>
    <div class="grid" id="gameGrid"></div>
    <div style="height:20px"></div>
  </section>

  <!-- GAME -->
  <section id="s-game" class="screen">
    <div class="topbar">
      <button class="btn gray" style="padding:9px 14px;font-size:15px" onclick="UI.goHome()">← Zurück</button>
      <div class="stars" id="gameStars"></div>
    </div>
    <div class="gamewrap" id="gameArea"></div>
  </section>

  <!-- PARENT -->
  <section id="s-parent" class="screen">
    <div class="topbar">
      <button class="btn gray" style="padding:9px 14px;font-size:15px" onclick="UI.goHome()">← Zurück</button>
      <button class="btn orange" style="padding:9px 14px;font-size:15px" onclick="UI.resetAll()">Reset</button>
    </div>
    <h1>Eltern-Bereich</h1>
    <div id="parentBody" style="max-width:560px;margin:0 auto;width:100%"></div>
    <div style="height:20px"></div>
  </section>

</div>

<script src="js/content.js"></script>
<script src="js/core.js"></script>
<script src="js/games.js"></script>
<script src="js/ui.js"></script>
<script>UI.boot();</script>
</body>
</html>
